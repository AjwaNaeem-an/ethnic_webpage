<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ethnic - Eastern Wear</title>

    <link rel="stylesheet" href="webpageStyle.css">

</head>


<body>

    <div class="product-page">

        <div class="page-top">

            <a href="webpage.html" class="back-link">
                ← Back to Home
            </a>

            <button
                type="button"
                id="themeButton">

                Toggle Light/Dark Mode

            </button>

        </div>


        <h1>Eastern Wear</h1>


        <img
            src="i1.jpg"
            alt="Eastern Wear">


        <p class="price">
            PKR 5000
        </p>


        <section>

            <h2>Size Chart</h2>

            <table>

                <thead>

                    <tr>
                        <th>Size</th>
                        <th>Chest</th>
                        <th>Length</th>
                        <th>Shoulder</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>Small</td>
                        <td>36</td>
                        <td>28</td>
                        <td>15</td>
                    </tr>

                    <tr>
                        <td>Medium</td>
                        <td>38</td>
                        <td>29</td>
                        <td>16</td>
                    </tr>

                    <tr>
                        <td>Large</td>
                        <td>40</td>
                        <td>30</td>
                        <td>17</td>
                    </tr>

                    <tr>
                        <td>XL</td>
                        <td>42</td>
                        <td>31</td>
                        <td>18</td>
                    </tr>

                </tbody>

            </table>

        </section>


        <section>

            <h2>Select Size</h2>

            <label>
                <input
                    type="radio"
                    name="size"
                    value="Small">

                Small
            </label>

            <label>
                <input
                    type="radio"
                    name="size"
                    value="Medium">

                Medium
            </label>

            <label>
                <input
                    type="radio"
                    name="size"
                    value="Large">

                Large
            </label>

            <label>
                <input
                    type="radio"
                    name="size"
                    value="XL">

                XL
            </label>

        </section>


        <section>

            <h2>Select Color</h2>

            <label>
                <input
                    type="radio"
                    name="color"
                    value="Orange">

                Orange
            </label>

            <label>
                <input
                    type="radio"
                    name="color"
                    value="Blue">

                Blue
            </label>

        </section>


        <section>

            <button
                type="button"
                id="addCartButton">

                Add to Cart

            </button>

            <p id="cartMessage"></p>

        </section>


        <section>

            <h2>Features</h2>

            <ul class="feature-list">

                <li>Embroidered</li>
                <li>Cotton</li>
                <li>Washable</li>

            </ul>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
