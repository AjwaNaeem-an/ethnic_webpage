<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ethnic - Login</title>

    <link rel="stylesheet" href="webpageStyle.css">

</head>


<body>

    <header>

        <h1>Ethnic</h1>

        <nav>
            <a href="webpage.html">Home</a>
            <a href="east.html">Eastern</a>
            <a href="west.html">Western</a>
        </nav>

    </header>


    <main class="form-page">

        <button
            type="button"
            id="themeButton">

            Toggle Light/Dark Mode

        </button>


        <form id="contactForm">

            <h2>Customer Login</h2>

            <p class="form-intro">
                Enter your details to continue.
            </p>


            <label for="name">
                Username
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your username">


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email">


            <label for="phoneNo">
                Phone Number
            </label>

            <input
                type="tel"
                id="phoneNo"
                placeholder="Enter your phone number">


            <label for="address">
                Address
            </label>

            <input
                type="text"
                id="address"
                placeholder="Enter your address">


            <label for="birth-year">
                Birth Year
            </label>

            <input
                type="text"
                id="birth-year"
                placeholder="Example: 2005">


            <label for="special-notes">
                Special Request
            </label>

            <textarea
                id="special-notes"
                maxlength="100"
                rows="4"
                placeholder="Write your request..."></textarea>


            <p id="charCount">
                100 characters remaining
            </p>


            <button type="submit">
                Submit
            </button>


            <p id="formMessage"></p>

            <p id="discountMessage"></p>

        </form>

    </main>


    <script src="script.js"></script>

</body>

</html>
